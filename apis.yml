aid: heven-aerotech
name: Heven AeroTech
description: >-
  Heven AeroTech (formerly Heven Drones) is a Dulles, Virginia headquartered manufacturer of
  hydrogen fuel-cell powered, runway-independent unmanned aircraft systems built for defense,
  national security and public safety missions. Founded in 2019, the company designs its own
  hydrogen propulsion stack and ships six named airframes — Raider, Z1, H2D55, Refueler, Atlas and
  Urban X — marketed on multi-hour endurance, low thermal and acoustic signature, and rapid payload
  and hydrogen-tank swaps. The Z1 is listed as a Blue UAS Select platform and the H2D55, Raider and
  Z1 are advertised as NDAA compliant. Heven operates sites in Dulles VA, Bingen WA, Mevo Carmel
  Israel and Mumbai India, and raised a $100M Series B led by IonQ. Heven AeroTech is a hardware
  manufacturer: it publishes no public developer program, API, SDK or machine-readable contract.
